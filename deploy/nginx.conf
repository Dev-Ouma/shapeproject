# /etc/nginx/sites-available/shape  — replace SUBDOMAIN below, then: certbot --nginx -d SUBDOMAIN
upstream shape_app { server 127.0.0.1:4321; keepalive 16; }

server {
  listen 80;
  server_name SUBDOMAIN;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name SUBDOMAIN;
  # ssl_certificate lines are added by certbot

  client_max_body_size 25m;
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Uploaded media straight from disk.
  location /uploads/ {
    alias /srv/shape/shared/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # Hashed build assets.
  location /_astro/ {
    proxy_pass http://shape_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Slow down brute force on the login form.
  location = /admin/login {
    limit_req zone=shape_login burst=5 nodelay;
    proxy_pass http://shape_app;
    include /etc/nginx/snippets/shape-proxy.conf;
  }

  location / {
    proxy_pass http://shape_app;
    include /etc/nginx/snippets/shape-proxy.conf;
    # Static files served by Node skip the app middleware; make sure they get nosniff + HSTS too.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}

